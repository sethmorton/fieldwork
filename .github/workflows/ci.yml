name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Synthetic binding builds the bundle; no browser or live account is used.
      - run: npm run setup -- --map 111111111111111111111111
      - run: npm run setup -- --map 222222222222222222222222 --pack content/philippines.json --add
      - run: npm run setup -- --map 333333333333333333333333 --pack content/worldwide.json --add
      - run: node --check dist/fieldwork.user.js
