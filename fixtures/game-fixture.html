<!doctype html><meta charset="utf-8"><title>Fieldwork runtime test</title><body style="font-family:Arial;background:#d6e4e9;padding:30px"><p>LOCAL TEST · no GeoGuessr account access · synthetic event</p><button id="finish">Simulate completed round</button><button id="last">Simulate completed final round</button><button id="native-next">Next</button><button id="repeat">Repeat event</button><button id="next">Simulate next round</button><p id="saved-count">0 saved attempts</p><script type="module">
const params=new URL(location.href).searchParams;
// mode=veg / veg-wrong: the real us-vegetation card from the built pack (dist/catalog.json), graded by completedRound.
// offline: every image fails, as with the installer stopped and nothing prefetched.
// region=<code> picks the round's region (default Coast Range); veg-wrong pins the nearest pano of another region.
if(params.get('mode')?.startsWith('veg')){
const {reviewPanel,completedRound}=await import('/dist/preview-ui.js');
const entry=(await (await fetch('/catalog.json')).json()).packs.find(item=>item.id==='us-vegetation');
const veg={...await (await fetch('/'+entry.url)).json(),practiceMapId:'000000000000000000000001'};
const loc=veg.locations.find(item=>item.region===(params.get('region')??'7.1.8')&&(!params.get('pano')||item.panoId===params.get('pano')));
const d=item=>(item.lat-loc.lat)**2+((item.lng-loc.lng)*Math.cos(loc.lat*Math.PI/180))**2;
const near=veg.locations.filter(item=>item.region!==loc.region).sort((a,b)=>d(a)-d(b))[0];
const guess=params.get('mode')==='veg-wrong'?{lat:near.lat,lng:near.lng}:{lat:loc.lat+0.05,lng:loc.lng+0.05};
const round=completedRound(veg,{map:{id:veg.practiceMapId},current_game_id:'fixture',current_round:Number(params.get('round')??3),round_in_progress:false,
  rounds:Array.from({length:5},()=>({location:{panoId:loc.panoId},player_guess:guess}))});
document.title=`veg ${round.correct}`;
reviewPanel(veg,round,{onSave:()=>[],onNext:()=>{throw Error('Fixture only. No map was changed.')},loadImage:params.has('offline')?()=>Promise.reject(Error('installer offline')):url=>fetch(url).then(response=>response.blob()).then(URL.createObjectURL)});
}else{
const pack=await (await fetch('/dist/practice-pack.json')).json();
const mode=new URL(location.href).searchParams.get('mode');
const skillId=new URL(location.href).searchParams.get('skill')??'au:lm:283';
history.replaceState(null,'','/game/game-fixture.html');
const source=pack.locations.find(location=>location.skillIds[0]===skillId);
const data={'fieldwork:pack':pack};window.GM_getValue=(key,fallback)=>data[key]??fallback;window.GM_setValue=(key,value)=>{data[key]=value;document.querySelector('#saved-count').textContent=(data['fieldwork:'+pack.id+':attempts']??[]).length+' saved attempts · '+(data['fieldwork:'+pack.id+':attempts']??[]).filter(item=>item.feedbackSource==='assumed-on-advance').length+' assumed · '+(data['fieldwork:'+pack.id+':attempts']??[]).filter(item=>item.feedbackSource==='explicit'&&!item.evidenceValid).length+' explicit misses'};
window.GM_listValues=()=>Object.keys(data);window.GM_deleteValue=key=>{delete data[key]};
window.unsafeWindow=window;const events=new EventTarget();const state={map:{id:pack.practiceMapId},current_game_id:'game-fixture.html',current_round:1,round_in_progress:true,rounds:[]};window.GeoGuessrEventFramework={events,state};
if(mode==='missed-start'){window.GEFFetchEvents=new EventTarget();state.current_game_id='previous-game';state.current_round=5;}
let responseRound=2;
const response=finished=>window.GEFFetchEvents.dispatchEvent(new CustomEvent('received_data',{detail:{token:'game-fixture.html',map:pack.practiceMapId,round:responseRound,rounds:Array.from({length:responseRound},()=>source),player:{guesses:Array.from({length:responseRound-(finished?0:1)},()=>({lat:source.lat,lng:source.lng}))}}}));
document.querySelector('#finish').onclick=()=>{const result=document.createElement('div');result.dataset.qa='result-view-top';document.body.append(result);if(mode==='missed-start'){
 // A late legacy event must not override the authoritative response or backfill round 1.
 events.dispatchEvent(new CustomEvent('round_end',{detail:{...state,current_game_id:'game-fixture.html',current_round:1,round_in_progress:false,rounds:[{location:source,player_guess:{lat:source.lat,lng:source.lng}}]}}));response(true);return;
}state.round_in_progress=false;state.rounds=Array.from({length:state.current_round},()=>({location:{panoId:source.panoId},player_guess:{lat:source.lat,lng:source.lng}}));events.dispatchEvent(new CustomEvent('round_end',{detail:state}))};
document.querySelector('#last').onclick=()=>{state.current_round=5;document.querySelector('#finish').click()};
document.querySelector('#native-next').onclick=()=>{if((mode==='missed-start'?responseRound:state.current_round)===5){document.querySelector('[data-qa="result-view-top"]')?.remove();history.replaceState(null,'','/results/game-fixture.html');return}document.querySelector('#next').click()};
document.querySelector('#repeat').onclick=()=>events.dispatchEvent(new CustomEvent('round_end',{detail:state}));
document.querySelector('#next').onclick=()=>{document.querySelector('[data-qa="result-view-top"]')?.remove();if(mode==='missed-start'){responseRound++;response(false);return;}state.current_round++;state.round_in_progress=true;events.dispatchEvent(new CustomEvent('round_start',{detail:state}))};
const script=document.createElement('script');script.src='/dist/fieldwork.user.js';document.body.append(script);
}
</script>
