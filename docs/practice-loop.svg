<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">The Fieldwork practice loop</title>
  <desc id="desc">Curated locations produce five varied targets. Guess in GeoGuessr, review after reveal, and use local progress to guide the next set.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#496b79" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="180" rx="14" fill="#eff6f8"/>
  <g fill="#fff" stroke="#a9c2cb"><rect x="20" y="35" width="160" height="72" rx="9"/><rect x="210" y="35" width="160" height="72" rx="9"/><rect x="400" y="35" width="160" height="72" rx="9"/><rect x="590" y="35" width="160" height="72" rx="9"/><rect x="780" y="35" width="160" height="72" rx="9"/></g>
  <g fill="none" stroke="#496b79" stroke-width="2" marker-end="url(#arrow)"><path d="M182 71h25"/><path d="M372 71h25"/><path d="M562 71h25"/><path d="M752 71h25"/><path d="M860 109v35H290v-34"/></g>
  <g fill="#153946" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600"><text x="100" y="66">Curated<tspan x="100" dy="23">locations</tspan></text><text x="290" y="66">Five varied<tspan x="290" dy="23">targets</tspan></text><text x="480" y="66">Guess in<tspan x="480" dy="23">GeoGuessr</tspan></text><text x="670" y="66">Review after<tspan x="670" dy="23">the reveal</tspan></text><text x="860" y="66">Local<tspan x="860" dy="23">progress</tspan></text></g>
  <text x="575" y="167" fill="#496b79" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">Gaps + new targets + older review</text>
</svg>
